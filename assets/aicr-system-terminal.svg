<svg xmlns="http://www.w3.org/2000/svg" width="920" height="224" viewBox="0 0 920 224" role="img" aria-labelledby="title desc">
  <title id="title">AICR professional cyberpunk system profile</title>
  <desc id="desc">Animated terminal introducing AICR as a private, human-led contract review system with source-linked evidence, visible uncertainty, and human decision authority.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#12212b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="line1"><rect x="28" y="58" width="0" height="24"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;820;820;820;0" keyTimes="0;0.02;0.17;0.93;0.98;1"/></rect></clipPath>
    <clipPath id="line2"><rect x="28" y="88" width="0" height="24"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;840;840;840;0" keyTimes="0;0.21;0.39;0.93;0.98;1"/></rect></clipPath>
    <clipPath id="line3"><rect x="28" y="118" width="0" height="24"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;850;850;850;0" keyTimes="0;0.43;0.61;0.93;0.98;1"/></rect></clipPath>
    <clipPath id="line4"><rect x="28" y="148" width="0" height="24"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;850;850;850;0" keyTimes="0;0.65;0.83;0.93;0.98;1"/></rect></clipPath>
  </defs>

  <rect width="920" height="224" rx="14" fill="#070b10"/>
  <rect x="1" y="1" width="918" height="222" rx="13" fill="none" stroke="#1f3a46"/>
  <rect x="7" y="7" width="906" height="210" rx="10" fill="url(#grid)" opacity="0.68"/>

  <rect x="18" y="16" width="884" height="28" rx="6" fill="#0b1219" stroke="#17323d"/>
  <text x="30" y="35" fill="#7ee7ff" font-family="monospace" font-size="13" letter-spacing="1.5">AI ARSENAL // AICR SYSTEM PROFILE</text>

  <g font-family="monospace" font-size="10" letter-spacing="0.5">
    <rect x="596" y="22" width="92" height="16" rx="8" fill="#0d1a17" stroke="#2bd67b"/>
    <text x="608" y="34" fill="#6fffb0">HUMAN-LED</text>
    <rect x="696" y="22" width="96" height="16" rx="8" fill="#0b1820" stroke="#26c6da"/>
    <text x="708" y="34" fill="#7ee7ff">LOCAL-FIRST</text>
    <rect x="800" y="22" width="92" height="16" rx="8" fill="#15160b" stroke="#c8b458"/>
    <text x="812" y="34" fill="#e8d77a">EVIDENCE</text>
  </g>

  <g font-family="monospace" font-size="18">
    <text x="28" y="76" clip-path="url(#line1)"><tspan fill="#7ee7ff">&gt; system:</tspan><tspan fill="#d9f7e5"> AI Contract Reviewer</tspan></text>
    <text x="28" y="106" clip-path="url(#line2)"><tspan fill="#7ee7ff">&gt; mode:</tspan><tspan fill="#48ff91"> private, human-led contract review</tspan></text>
    <text x="28" y="136" clip-path="url(#line3)"><tspan fill="#7ee7ff">&gt; evidence:</tspan><tspan fill="#d9f7e5"> findings linked to contract language</tspan></text>
    <text x="28" y="166" clip-path="url(#line4)"><tspan fill="#7ee7ff">&gt; authority:</tspan><tspan fill="#48ff91"> human reviewer makes the decision</tspan></text>
  </g>

  <line x1="28" y1="184" x2="892" y2="184" stroke="#16303a"/>
  <text x="28" y="204" fill="#7a929e" font-family="monospace" font-size="11" letter-spacing="1.1">STATUS: REVIEW SUPPORT // UNCERTAINTY VISIBLE // HUMAN DECISION REQUIRED</text>
  <text x="880" y="166" fill="#48ff91" font-family="monospace" font-size="18">█
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <rect x="10" y="0" width="2" height="224" fill="#26d9ff" opacity="0.12">
    <animate attributeName="x" from="10" to="908" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>